<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <!-- Sin user-scalable=no ni maximum-scale: bloquear el zoom es una barrera de accesibilidad. El zoom accidental
         al enfocar un campo se evita con campos de 16 px (css/main.css). viewport-fit=cover pinta bajo el notch y
         las áreas seguras se rellenan con env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>TruckCar</title>
    <meta name="description" content="Navegación, entregas con prueba digital y alertas viales para transporte pesado, con funcionamiento sin señal.">
    <!-- URL del api-gateway en despliegue. Vacío = automático (localhost:8000 en local, mismo origen en producción). -->
    <meta name="truckcar-api-base-url" content="">

    <!-- PWA: instalable y operable sin señal (sw.js + cola durable js/offlineQueue.js). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TruckCar">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // :hover solo con un puntero que puede hacer hover: en el teléfono no se queda "pegado" tras un toque.
            future: { hoverOnlyWhenSupported: true },
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SF Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 font-sans antialiased">

    <nav id="top-nav" class="safe-top safe-x bg-slate-900/95 border-b border-slate-800 z-50 shrink-0">
        <div class="h-14 px-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="assets/icon.svg" alt="" class="w-9 h-9 rounded-[11px] shadow-lg shadow-black/40">
                <div class="leading-tight">
                    <span class="font-black text-white text-base tracking-tight">TRUCK<span class="text-brand-400">CAR</span></span>
                    <span class="hidden sm:block text-[10px] text-slate-400 font-medium">Transporte pesado · Telemática en vivo</span>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <span data-network-status class="hidden lg:inline-flex"></span>

                <div id="role-switcher" class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center gap-1">
                    <button id="role-btn-driver" onclick="window.app.setRole('driver')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 text-slate-400 hover:text-slate-200">
                        <i class="fas fa-mobile-screen"></i>
                        <span class="hidden md:inline">Conductor</span>
                    </button>
                    <button id="role-btn-coordinator" onclick="window.app.setRole('coordinator')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 text-slate-400 hover:text-slate-200">
                        <i class="fas fa-tower-broadcast"></i>
                        <span class="hidden md:inline">Torre de Control</span>
                    </button>
                </div>

                <!-- Herramientas de la demostración en escritorio: en el teléfono no se muestran. -->
                <button id="rotate-device-btn" onclick="window.app.toggleRotation()" class="demo-only px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow" title="Rotar pantalla (Horizontal / Vertical)">
                    <i class="fas fa-rotate text-brand-400"></i>
                    <span class="hidden sm:inline">Rotar</span>
                </button>

                <button id="gps-step-btn" onclick="window.app.nextSimulationStep()" class="demo-only px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow" title="Avanzar posición GPS simulada">
                    <i class="fas fa-forward-step text-brand-400"></i>
                    <span class="hidden sm:inline">Avanzar GPS</span>
                </button>

                <button onclick="window.app.toggleVoice()" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs flex items-center justify-center shadow" title="Activar o silenciar la voz de navegación" aria-label="Activar o silenciar la voz de navegación">
                    <i class="fas fa-volume-up text-brand-400"></i>
                </button>
            </div>
        </div>
    </nav>

    <main id="app-main" class="flex-1 relative overflow-hidden flex items-center justify-center p-2 sm:p-4 bg-slate-950">
        <div id="workspace-container" class="w-full h-full flex items-center justify-center">
            <div id="phone-mockup-frame" class="phone-frame w-full h-full flex flex-col overflow-hidden">
                <div id="app-mount" class="w-full h-full"></div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui/toaster.js"></script>
    <script src="js/ui/sheet.js"></script>
    <script src="js/offlineQueue.js"></script>
    <script src="js/podEvidence.js"></script>
    <script src="js/dataService.js"></script>
    <script src="js/telemetry.js"></script>
    <script src="js/ui/native.js"></script>
    <script src="js/speechEngine.js"></script>
    <script src="js/mapController.js"></script>
    <script src="js/views/loginView.js"></script>
    <script src="js/views/driverApp.js"></script>
    <script src="js/views/coordinatorPanel.js"></script>
    <script src="js/views/podModals.js"></script>
    <script src="js/views/generatorPanel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
