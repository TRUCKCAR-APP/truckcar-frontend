<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>TruckCar</title>
    <meta name="description" content="Navegación, entregas con prueba digital y alertas viales para transporte pesado, con funcionamiento sin señal.">
    <meta name="truckcar-api-base-url" content="">
    <meta name="truckcar-map-api-key" content="">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0C0E12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TruckCar">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="js/theme.js"></script>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
    <script src="assets/vendor/leaflet/leaflet.js"></script>

    <link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 font-sans antialiased">

    <nav id="top-nav" class="safe-top safe-x bg-slate-900/95 border-b border-slate-800 z-50 shrink-0">
        <div class="h-14 px-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="brand-logo nav-logo">
                    <img src="assets/brand/truckcar-logo.png" alt="" class="brand-logo-light" width="854" height="831">
                    <img src="assets/brand/truckcar-logo-blanco.png" alt="" class="brand-logo-dark" width="854" height="831">
                </span>
                <div class="leading-tight">
                    <span class="wordmark">TruckCar</span>
                    <span class="hidden sm:block text-xs text-slate-400 font-medium">Transporte pesado · Telemática en vivo</span>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <span data-network-status class="hidden lg:inline-flex"></span>
                <label class="theme-select-wrap">
                    <span class="sr-only">Tema visual</span>
                    <select data-theme-select aria-label="Tema visual" class="theme-select">
                        <option value="system">Auto</option>
                        <option value="light">Claro</option>
                        <option value="dark">Oscuro</option>
                    </select>
                </label>

                <div id="role-switcher" class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center gap-1">
                    <button id="role-btn-driver" onclick="window.app.setRole('driver')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 text-slate-400 hover:text-slate-200">
                        <i class="fas fa-mobile-screen"></i>
                        <span class="hidden md:inline">Conductor</span>
                    </button>
                    <button id="role-btn-coordinator" onclick="window.app.setRole('coordinator')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 text-slate-400 hover:text-slate-200">
                        <i class="fas fa-tower-broadcast"></i>
                        <span class="hidden md:inline">Torre de Control</span>
                    </button>
                </div>

                <button id="rotate-device-btn" onclick="window.app.toggleRotation()" class="demo-only px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5" title="Rotar pantalla (Horizontal / Vertical)">
                    <i class="fas fa-rotate"></i>
                    <span class="hidden sm:inline">Rotar</span>
                </button>

                <button id="sim-toggle-btn" onclick="window.DriverTelemetry.toggleSimulation()" aria-pressed="false" class="demo-only sim-toggle px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5" title="Herramienta de prueba: simular el movimiento del GPS sobre la ruta">
                    <i class="fas fa-flask"></i>
                    <span class="hidden sm:inline" data-sim-label>Simular GPS</span>
                </button>

                <button id="voice-btn" onclick="window.app.toggleVoice()" class="w-11 h-11 hover:bg-slate-800 text-slate-300 rounded-xl flex items-center justify-center" title="Activar o silenciar la voz de navegación" aria-label="Activar o silenciar la voz de navegación">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>
    </nav>

    <main id="app-main" class="flex-1 relative overflow-hidden flex items-center justify-center p-2 sm:p-4 bg-slate-950">
        <div id="workspace-container" class="w-full h-full flex items-center justify-center">
            <div id="phone-mockup-frame" class="phone-frame w-full h-full flex flex-col overflow-hidden">
                <div id="app-mount" class="w-full h-full"></div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui/toaster.js"></script>
    <script src="js/ui/sheet.js"></script>
    <script src="js/offlineQueue.js"></script>
    <script src="js/tileStore.js"></script>
    <script src="js/podEvidence.js"></script>
    <script src="js/dataService.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/telemetry.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/ui/native.js"></script>
    <script src="js/speechEngine.js"></script>
    <script src="js/mapController.js"></script>
    <script src="js/views/loginView.js"></script>
    <script src="js/views/driverApp.js"></script>
    <script src="js/views/driverActions.js"></script>
    <script src="js/views/coordinatorPanel.js"></script>
    <script src="js/views/podModals.js"></script>
    <script src="js/views/generatorPanel.js"></script>
    <script src="js/views/sosMonitor.js"></script>
    <script src="js/views/publicTracking.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/messagingService.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
