# CI de truckcar-frontend: sintaxis de todos los scripts, ESLint y pruebas del Service Worker (sw.js) y de la cola
# offline (js/offlineQueue.js sobre IndexedDB en memoria). En main publica la imagen nginx de la PWA en GHCR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Sintaxis, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - name: Sintaxis de los scripts
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Service Worker y cola offline
        run: npm test

  image:
    name: Imagen de contenedor
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/truckcar-app/truckcar-frontend:main
            ghcr.io/truckcar-app/truckcar-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
