<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0C0E12">
    <title>Carga en tránsito · prototipo TruckCar</title>
    <link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="proto.css">
</head>
<body data-screen="carga">
<div class="app">
    <div data-header></div>

    <main class="screen">
        <span class="status"><span class="dot ok"></span>En tránsito <span class="sub">· CARGA-88 · salió 2:05 p. m.</span></span>

        <div class="trip">
            <div class="rail"><span class="stop"></span><span class="line"></span></div>
            <div class="leg">
                <div class="place-label">Origen</div>
                <div class="place">Bogotá</div>
                <div class="place-sub">Cundinamarca</div>
            </div>
            <div class="rail"><span class="stop end"></span></div>
            <div class="leg">
                <div class="place-label">Destino</div>
                <div class="place">Ibagué</div>
                <div class="place-sub">Tolima · 195 km</div>
            </div>
        </div>

        <div class="fare">
            <div class="place-label">Flete</div>
            <div class="amount">$ 3.800.000<small>COP</small></div>
            <div class="place-sub">Cafés del Tolima S.A.S.</div>
        </div>

        <h2 class="group-title">Detalle de la carga</h2>
        <div class="group">
            <div class="row"><span class="label">Mercancía</span><span class="value">Café verde, sacos de 70 kg</span></div>
            <div class="row"><span class="label">Peso</span><span class="value strong">24,0 t</span></div>
            <div class="row"><span class="label">Vehículo requerido</span><span class="value">Tractocamión 3S3</span></div>
            <div class="row"><span class="label">Posición</span><span class="value"><span class="dot ok"></span>Transmitiendo · GPS ±9 m</span></div>
        </div>

        <div class="actions">
            <button type="button" class="btn-primary"><svg class="icon" aria-hidden="true"><use href="icons.svg#navigation-arrow-fill"></use></svg>Continuar navegación</button>
            <button type="button" class="btn-text"><svg class="icon" aria-hidden="true"><use href="icons.svg#flag-checkered"></use></svg>Llegué: registrar entrega</button>
        </div>
    </main>

    <div data-tabbar></div>
</div>
<script src="proto.js"></script>
</body>
</html>
