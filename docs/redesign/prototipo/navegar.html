<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0C0E12">
    <title>Navegar · prototipo TruckCar</title>
    <link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="proto.css">
</head>
<body data-screen="navegar">
<div class="app">
    <div data-header></div>

    <div class="map-screen nav-screen">
      <div class="map-area">
        <div id="map" aria-label="Mapa de navegación"></div>

        <!-- Una sola tarjeta superior: maniobra + distancia, límite de velocidad y gálibo. -->
        <section class="hud-card" aria-live="polite" aria-label="Próxima maniobra">
            <div class="hud-turn">
                <div class="hud-arrow"><svg class="icon" aria-hidden="true"><use href="icons.svg#arrow-up-left"></use></svg></div>
                <div>
                    <div class="hud-distance" data-distance></div>
                    <div class="hud-instruction" data-instruction></div>
                </div>
            </div>
            <div class="hud-meta">
                <div><div class="k">Altura del vehículo</div><div class="v">4,10 m</div></div>
                <div><div class="k">Peso bruto</div><div class="v">40,0 t</div></div>
            </div>
            <div class="hud-warning" data-offroute hidden>
                <div class="warn-line"><svg class="icon" aria-hidden="true"><use href="icons.svg#warning-fill"></use></svg>
                    <span>Fuera de la ruta <span class="sub">· recalculando desde su posición</span></span></div>
            </div>
        </section>

        <!-- Panel vertical derecho: velocidad, voz y reporte. -->
        <div class="hud-panel">
            <div class="hud-speed" aria-label="Velocidad actual"><b data-speed></b><span>km/h</span></div>
            <button type="button" class="hud-btn" aria-label="Silenciar la voz"><svg class="icon" aria-hidden="true"><use href="icons.svg#speaker-high"></use></svg></button>
            <button type="button" class="hud-btn" data-open-report aria-label="Reportar novedad en la vía"><svg class="icon" aria-hidden="true"><use href="icons.svg#megaphone"></use></svg></button>
        </div>

      </div>

        <div class="trip-bar">
            <div class="remaining"><b data-remaining></b><span data-eta></span><span data-route-line></span></div>
            <button type="button" class="btn-secondary"><svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#flag-checkered"></use></svg>Llegué</button>
        </div>
    </div>

    <div data-tabbar></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="route.js"></script>
<script src="nav-state.js"></script>
<script src="proto.js"></script>
<script>
    (function () {
        const s = window.NAV_STATE;
        const set = (sel, text) => { document.querySelector(sel).textContent = text; };
        set('[data-distance]', s.distance);
        set('[data-instruction]', s.instruction);
        set('[data-speed]', s.speed);
        // Misma ruta que la pantalla Rutas: nombre, distancia total y tiempo (OSRM, perfil de auto).
        const route = window.ROUTE;
        const left = parseFloat(s.remaining);
        const mins = Math.round(route.durationMin * left / route.distanceKm);
        set('[data-remaining]', 'Faltan ' + s.remaining);
        set('[data-eta]', Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min · estimado para auto');
        set('[data-route-line]', 'Bogotá → Ibagué · ' + Math.round(route.distanceKm) + ' km');
        if (new URLSearchParams(location.search).get('estado') === 'fuera') document.querySelector('[data-offroute]').hidden = false;

        const pts = window.ROUTE.points;
        // Índice del punto de la ruta más cercano a la posición: lo recorrido va en gris, lo que falta en azul.
        let near = 0, best = Infinity;
        pts.forEach((p, i) => { const d = (p[0] - s.position[0]) ** 2 + (p[1] - s.position[1]) ** 2; if (d < best) { best = d; near = i; } });
        const a = pts[near], b = pts[Math.min(near + 1, pts.length - 1)];
        const heading = (Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI + 360) % 360;

        const map = L.map('map', { zoomControl: false, attributionControl: false });
        L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
            maxZoom: 20, attribution: '&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap'
        }).addTo(map);
        const line = (latlngs, color, weight) => L.polyline(latlngs, { color, weight, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(map);
        line(pts.slice(0, near + 1).concat([s.position]), '#3A4049', 7);
        line([s.position].concat(pts.slice(near + 1)), '#0C0E12', 11);
        line([s.position].concat(pts.slice(near + 1)), '#5AA2FF', 7);
        L.marker(s.position, { icon: L.divIcon({ className: '', iconSize: [44, 44], iconAnchor: [22, 22],
            html: '<span class="pin-truck" style="--heading:' + heading + 'deg"><svg class="icon"><use href="icons.svg#heading"></use></svg></span>' }) }).addTo(map);
        map.setView(s.position, 15);
        // La posición queda en el tercio inferior: se ve más vía por delante, por debajo de la tarjeta superior.
        map.panBy([0, -110], { animate: false });
        new ResizeObserver(() => map.invalidateSize({ pan: false })).observe(document.getElementById('map'));
    })();
</script>
<style>
    .map-screen .leaflet-control-attribution { margin: 0 0 var(--s-2) var(--s-2) !important; }
</style>
</body>
</html>
