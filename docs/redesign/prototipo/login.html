<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0C0E12">
    <title>Iniciar sesión · prototipo TruckCar</title>
    <link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="proto.css">
    <style>body.login-page { overflow: auto; }</style>
</head>
<body class="login-page" data-screen="login">
<div class="login-panel">
    <main class="login">
        <img class="mark" src="../../../assets/icon.svg" alt="">
        <h1>Inicie sesión en TruckCar</h1>
        <p class="lead">Cargas, ruta segura para su vehículo y entregas con prueba, incluso sin señal.</p>

        <form onsubmit="return false">
            <div class="field">
                <label for="email">Correo</label>
                <div class="input placeholder" id="email" role="textbox">correo@empresa.com</div>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <div class="input placeholder" id="password" role="textbox">Contraseña</div>
                    <button type="button" class="icon-btn" aria-label="Mostrar la contraseña"><svg class="icon" aria-hidden="true"><use href="icons.svg#eye"></use></svg></button>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn-primary"><svg class="icon" aria-hidden="true"><use href="icons.svg#sign-in"></use></svg>Entrar</button>
            </div>
        </form>
        <p class="alt">¿No tiene cuenta? <a href="#">Registrarse</a></p>
    </main>
</div>
<script src="proto.js"></script>
</body>
</html>
